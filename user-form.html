<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户信息登记表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        label .required {
            color: #e74c3c;
            margin-left: 4px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .radio-group {
            display: flex;
            gap: 20px;
            padding: 8px 0;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .radio-option span {
            font-size: 15px;
            color: #333;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .success-message {
            display: none;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .form-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #999;
        }

        .data-display {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .data-display.show {
            display: block;
        }

        .data-display h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e1e1e1;
        }

        .data-item:last-child {
            border-bottom: none;
        }

        .data-label {
            color: #666;
            font-weight: 500;
        }

        .data-value {
            color: #333;
            font-weight: 600;
        }

        .clear-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #f8f9fa;
            color: #666;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #e9ecef;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 用户信息登记表</h1>
        <p class="subtitle">请填写以下基本信息</p>

        <form id="userForm">
            <div class="form-group">
                <label for="name">
                    姓名 <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="请输入您的姓名"
                    required
                >
                <div class="error-message" id="nameError">请输入姓名</div>
            </div>

            <div class="form-group">
                <label>
                    性别 <span class="required">*</span>
                </label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="gender" value="male" required>
                        <span>男</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="gender" value="female" required>
                        <span>女</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="gender" value="other" required>
                        <span>其他</span>
                    </label>
                </div>
                <div class="error-message" id="genderError">请选择性别</div>
            </div>

            <div class="form-group">
                <label for="education">
                    学历 <span class="required">*</span>
                </label>
                <select id="education" name="education" required>
                    <option value="">请选择学历</option>
                    <option value="high_school">高中/中专</option>
                    <option value="associate">大专</option>
                    <option value="bachelor">本科</option>
                    <option value="master">硕士</option>
                    <option value="doctor">博士</option>
                    <option value="other">其他</option>
                </select>
                <div class="error-message" id="educationError">请选择学历</div>
            </div>

            <div class="form-group">
                <label for="age">
                    年龄 <span class="required">*</span>
                </label>
                <input 
                    type="number" 
                    id="age" 
                    name="age" 
                    placeholder="请输入年龄"
                    min="1"
                    max="150"
                    required
                >
                <div class="error-message" id="ageError">请输入有效年龄 (1-150)</div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                提交信息
            </button>
        </form>

        <div class="success-message" id="successMessage">
            ✅ 提交成功！您的信息已保存。
        </div>

        <div class="data-display" id="dataDisplay">
            <h3>📄 已提交的数据</h3>
            <div class="data-item">
                <span class="data-label">姓名</span>
                <span class="data-value" id="displayName">-</span>
            </div>
            <div class="data-item">
                <span class="data-label">性别</span>
                <span class="data-value" id="displayGender">-</span>
            </div>
            <div class="data-item">
                <span class="data-label">学历</span>
                <span class="data-value" id="displayEducation">-</span>
            </div>
            <div class="data-item">
                <span class="data-label">年龄</span>
                <span class="data-value" id="displayAge">-</span>
            </div>
            <div class="data-item">
                <span class="data-label">提交时间</span>
                <span class="data-value" id="displayTime">-</span>
            </div>
            <button class="clear-btn" id="clearBtn">清除数据</button>
        </div>

        <div class="form-footer">
            数据将保存在本地浏览器中
        </div>
    </div>

    <script>
        const form = document.getElementById('userForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');
        const dataDisplay = document.getElementById('dataDisplay');

        // 学历映射
        const educationMap = {
            'high_school': '高中/中专',
            'associate': '大专',
            'bachelor': '本科',
            'master': '硕士',
            'doctor': '博士',
            'other': '其他'
        };

        // 性别映射
        const genderMap = {
            'male': '男',
            'female': '女',
            'other': '其他'
        };

        // 页面加载时检查是否有已保存的数据
        window.addEventListener('DOMContentLoaded', () => {
            loadSavedData();
        });

        // 表单提交处理
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 验证表单
            if (!validateForm()) {
                return;
            }

            // 获取表单数据
            const formData = new FormData(form);
            const data = {
                name: formData.get('name').trim(),
                gender: formData.get('gender'),
                education: formData.get('education'),
                age: parseInt(formData.get('age')),
                submitTime: new Date().toISOString()
            };

            // 禁用提交按钮
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';

            // 模拟提交延迟
            await new Promise(resolve => setTimeout(resolve, 800));

            // 保存数据到 localStorage
            localStorage.setItem('userFormData', JSON.stringify(data));

            // 恢复按钮状态
            submitBtn.disabled = false;
            submitBtn.textContent = '提交信息';

            // 显示成功消息
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);

            // 显示已保存的数据
            displayData(data);

            // 重置表单
            form.reset();
        });

        // 验证表单
        function validateForm() {
            let isValid = true;

            // 验证姓名
            const name = document.getElementById('name');
            const nameError = document.getElementById('nameError');
            if (!name.value.trim()) {
                nameError.classList.add('show');
                name.style.borderColor = '#e74c3c';
                isValid = false;
            } else {
                nameError.classList.remove('show');
                name.style.borderColor = '#e1e1e1';
            }

            // 验证性别
            const genderSelected = document.querySelector('input[name="gender"]:checked');
            const genderError = document.getElementById('genderError');
            if (!genderSelected) {
                genderError.classList.add('show');
                isValid = false;
            } else {
                genderError.classList.remove('show');
            }

            // 验证学历
            const education = document.getElementById('education');
            const educationError = document.getElementById('educationError');
            if (!education.value) {
                educationError.classList.add('show');
                education.style.borderColor = '#e74c3c';
                isValid = false;
            } else {
                educationError.classList.remove('show');
                education.style.borderColor = '#e1e1e1';
            }

            // 验证年龄
            const age = document.getElementById('age');
            const ageError = document.getElementById('ageError');
            const ageValue = parseInt(age.value);
            if (!age.value || ageValue < 1 || ageValue > 150) {
                ageError.classList.add('show');
                age.style.borderColor = '#e74c3c';
                isValid = false;
            } else {
                ageError.classList.remove('show');
                age.style.borderColor = '#e1e1e1';
            }

            return isValid;
        }

        // 显示数据
        function displayData(data) {
            document.getElementById('displayName').textContent = data.name;
            document.getElementById('displayGender').textContent = genderMap[data.gender];
            document.getElementById('displayEducation').textContent = educationMap[data.education];
            document.getElementById('displayAge').textContent = data.age + ' 岁';
            document.getElementById('displayTime').textContent = new Date(data.submitTime).toLocaleString('zh-CN');
            dataDisplay.classList.add('show');
        }

        // 加载已保存的数据
        function loadSavedData() {
            const savedData = localStorage.getItem('userFormData');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    displayData(data);
                } catch (e) {
                    console.error('加载数据失败:', e);
                }
            }
        }

        // 清除数据
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (confirm('确定要清除已保存的数据吗？')) {
                localStorage.removeItem('userFormData');
                dataDisplay.classList.remove('show');
            }
        });

        // 实时验证 - 移除错误样式
        form.querySelectorAll('input, select').forEach(input => {
            input.addEventListener('input', () => {
                input.style.borderColor = '#e1e1e1';
                const errorEl = document.getElementById(input.id + 'Error');
                if (errorEl) {
                    errorEl.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>
